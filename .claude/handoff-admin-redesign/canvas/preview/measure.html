<!doctype html><html><head><meta charset="utf-8"><title>measure</title>
<style>body{margin:0;font:13px system-ui}iframe{border:0;display:block}#out{white-space:pre;padding:12px;background:#111;color:#eee}</style></head>
<body><div id="out">measuring…</div><div id="frames"></div>
<script>
// Loads every preview in an iframe at its frame width and reports the real
// rendered height, so measured.json is measured rather than guessed.
const FRAMES = JSON.parse(decodeURIComponent(location.hash.slice(1) || "%5B%5D"));
const out = {}; let pending = FRAMES.length;
for (const [name, width] of FRAMES) {
  const f = document.createElement("iframe");
  f.src = `./${name}.html`; f.width = width; f.height = 200; f.dataset.name = name;
  f.onload = () => {
    const d = f.contentDocument;
    // let webfonts settle before measuring
    (d.fonts ? d.fonts.ready : Promise.resolve()).then(() => setTimeout(() => {
      out[name] = Math.max(d.documentElement.scrollHeight, d.body.scrollHeight);
      if (--pending === 0) document.getElementById("out").textContent = JSON.stringify(out, null, 0);
    }, 300));
  };
  document.getElementById("frames").appendChild(f);
}
</script></body></html>
