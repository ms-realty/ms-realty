# From the estate Dependabot template: github-actions, plus npm for
# package-lock.json (no other manifests exist here). Patch and minor updates
# arrive as one grouped PR per ecosystem; majors come one PR each.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      patch-and-minor:
        update-types: [patch, minor]

  - package-ecosystem: npm
    directories: ['**/*']
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    # @types/node follows the runtime major (Node 24 in the selected image);
    # bump it by hand together with the image.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      patch-and-minor:
        update-types: [patch, minor]
