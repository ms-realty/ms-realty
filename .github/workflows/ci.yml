name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Type 'production' to request a release. Blocked until every docs/plan.md §7 launch gate is green."
        required: false
        default: "none"
  repository_dispatch:
    types: [auto_merge_deploy]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    # Branch protection requires this exact check name.
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: pg
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          retention-days: 7

  release:
    name: Release (blocked until launch gates pass)
    if: github.event_name == 'workflow_dispatch' && inputs.release == 'production'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No deploy steps exist on purpose (docs/plan.md §1). Replace this step only when
      # every gate below is green and recorded.
      - name: Launch gates (docs/plan.md §7)
        run: |
          cat <<'GATES'
          Deployment is allowed only when all of these are true and recorded (docs/plan.md §7):
          1. All slices S1-S6 and S8 merged; S7 flags off unless the owner enables a service.
          2. npm run check green on the release commit; Playwright T1-T5 green in every enabled locale.
          3. Production data ETL rehearsed on a restored copy of the live database with row-count and
             checksum reconciliation; backup + isolated restore drill passed within 30 days.
          4. Security review of auth, authz, uploads, edge and secrets with no open high findings.
          5. WCAG 2.2 AA task checks (keyboard, screen reader, zoom, RTL) on T1-T5 recorded.
          6. Core Web Vitals lab budgets met on the preview host for P01, P02, P05.
          7. Monitoring and alerting live (health, error rate, job queue, outbox failures) with a named
             on-call owner.
          8. Owner inputs in spec §23.3 supplied: coverage, enabled locales + reviewers, service hours,
             response promises, disclosure policies, retention/privacy policy, staff capabilities.
          9. Owner launch decision recorded; .ru renewed if it is to be routed.
          GATES
          echo "::error::Release blocked: the launch gates are not yet green, and this workflow has no deploy steps."
          exit 1
