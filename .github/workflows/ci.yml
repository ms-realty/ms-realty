name: CI

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [auto_merge_deploy]

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a production deployment halfway through its health check or rollback.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency audit
        run: npm run audit

      # No NODE_ENV/tokens here: the test suite relies on the local
      # non-production admin-token fallback and fixture defaults.
      - name: Generate runtime reports (gitignored, tests expect them)
        run: npm run payload:runtime

      - name: Tests and validation
        run: npm test && npm run validate

      # next build sets NODE_ENV=production itself; Payload config wants
      # these present at build time. Dummy non-secret values, build-only.
      - name: Next.js production build
        run: npm run next:build
        env:
          PAYLOAD_SECRET: ci-build-secret-not-a-real-secret-0123456789
          DATABASE_URL: postgresql://localhost:5432/ms_realty_ci

      - name: Smoke built Next runtime
        run: npm run next:smoke
        env:
          PAYLOAD_SECRET: ci-build-secret-not-a-real-secret-0123456789
          DATABASE_URL: postgresql://localhost:5432/ms_realty_ci

      - name: Build and smoke deployable container
        id: container_smoke
        run: |
          image="ms-realty-ci:${GITHUB_SHA}"
          DOCKER_BUILDKIT=1 docker build --build-arg "MS_REALTY_BUILD_MARKER=$GITHUB_SHA" --tag "$image" .
          container_id="$(docker run --detach --publish 127.0.0.1::8080 \
            --env PAYLOAD_SECRET=ci-build-secret-not-a-real-secret-0123456789 \
            --env DATABASE_URL=postgresql://localhost:5432/ms_realty_ci \
            "$image")"
          echo "container_id=$container_id" >> "$GITHUB_OUTPUT"
          port="$(docker port "$container_id" 8080/tcp | sed -n 's/.*:\([0-9][0-9]*\)$/\1/p')"
          test -n "$port"
          for _ in $(seq 1 30); do
            if curl --fail --silent "http://127.0.0.1:${port}/api/health" > /tmp/ms-realty-health.json; then
              break
            fi
            sleep 1
          done
          test -s /tmp/ms-realty-health.json
          node -e 'const d=JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); if (d.build_marker !== process.env.GITHUB_SHA) process.exit(1)' /tmp/ms-realty-health.json
          expected_ready_status="$(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync("/tmp/ms-realty-health.json", "utf8")).launch_ready ? "200" : "503")')"
          ready_status="$(curl --silent --show-error --output /tmp/ms-realty-ready.json --write-out '%{http_code}' "http://127.0.0.1:${port}/api/ready")"
          test "$ready_status" = "$expected_ready_status"

      - name: Show deployable container logs on failure
        if: failure() && steps.container_smoke.outputs.container_id != ''
        run: docker logs "${{ steps.container_smoke.outputs.container_id }}"

      - name: Stop deployable container
        if: always() && steps.container_smoke.outputs.container_id != ''
        run: docker rm --force "${{ steps.container_smoke.outputs.container_id }}"

  deploy_origin:
    name: Deploy durable origin
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'repository_dispatch' &&
      github.event.action == 'auto_merge_deploy' &&
      github.event.client_payload.merge_sha == github.sha))
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      previous_release: ${{ steps.previous_origin.outputs.release }}
      previous_marker: ${{ steps.previous_origin.outputs.marker }}
      previous_ready: ${{ steps.previous_origin.outputs.ready }}
      previous_blockers: ${{ steps.previous_origin.outputs.blockers }}
      workers_dev_url: ${{ steps.workers_dev.outputs.url }}
    env:
      MS_REALTY_DEPLOY_HOST: ${{ vars.MS_REALTY_DEPLOY_HOST }}
      MS_REALTY_DEPLOY_KNOWN_HOSTS: ${{ secrets.MS_REALTY_DEPLOY_KNOWN_HOSTS }}
      MS_REALTY_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.MS_REALTY_DEPLOY_SSH_PRIVATE_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require origin deployment credentials
        run: |
          test -n "$MS_REALTY_DEPLOY_HOST"
          test -n "$MS_REALTY_DEPLOY_KNOWN_HOSTS"
          test -n "$MS_REALTY_DEPLOY_SSH_PRIVATE_KEY"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "${#GITHUB_SHA}" = 40

      - name: Prepare pinned SSH identity
        run: |
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$MS_REALTY_DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$MS_REALTY_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Resolve workers.dev health endpoint
        id: workers_dev
        run: |
          response="$(curl --fail --silent --show-error --max-time 20 \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain")"
          subdomain="$(node -e 'const d=JSON.parse(process.argv[1]); const value=d.success && d.result?.subdomain; if (typeof value !== "string" || !/^[a-z0-9-]{1,63}$/i.test(value)) process.exit(1); process.stdout.write(value)' "$response")"
          echo "url=https://ms-realty.${subdomain}.workers.dev/api/health" >> "$GITHUB_OUTPUT"

      - name: Capture active origin release and readiness
        id: previous_origin
        run: |
          ssh_args=(-i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts")
          release="$(ssh "${ssh_args[@]}" "root@$MS_REALTY_DEPLOY_HOST" 'set -e; target="$(readlink -f /opt/ms-realty/current)"; case "$target" in /opt/ms-realty/releases/*) basename "$target" ;; *) exit 1 ;; esac')"
          [[ "$release" =~ ^[0-9a-f]{40}$ ]]
          health_url="${{ steps.workers_dev.outputs.url }}"
          marker=""
          for attempt in $(seq 1 100); do
            if curl --fail --silent --show-error --max-time 20 --header "Cache-Control: no-cache" "$health_url" --output "$RUNNER_TEMP/previous-health.json" &&
              marker="$(node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (d.service !== "ms-realty" || d.status !== "ok") process.exit(1); if (d.build_marker === undefined || d.build_marker === "unversioned") process.stdout.write("legacy"); else if (typeof d.build_marker === "string" && /^[0-9a-f]{40}$/i.test(d.build_marker)) process.stdout.write(d.build_marker); else process.exit(1)' "$RUNNER_TEMP/previous-health.json")"; then
              break
            fi
            echo "Pre-activation health check attempt $attempt/100 failed; retrying."
            sleep 10
          done
          test -n "$marker"
          if [ "$marker" = "legacy" ]; then marker=""; fi
          ready="$(node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(d.launch_ready === true ? "true" : "false")' "$RUNNER_TEMP/previous-health.json")"
          blockers="$(node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); const rows=Array.isArray(d.blockers) ? d.blockers : []; if (!rows.every((value) => typeof value === "string" && /^[a-z0-9_:-]+$/.test(value))) process.exit(1); process.stdout.write([...rows].sort().join(","))' "$RUNNER_TEMP/previous-health.json")"
          {
            echo "release=$release"
            echo "marker=$marker"
            echo "ready=$ready"
            echo "blockers=$blockers"
          } >> "$GITHUB_OUTPUT"

      - name: Capture exact-release R2 media coverage
        run: |
          node production/scripts/repair-missing-r2-media.mjs \
            --list-only \
            --listing-output "$RUNNER_TEMP/r2-media-objects.json"
          node production/scripts/build-r2-media-coverage.mjs \
            --input "$RUNNER_TEMP/r2-media-objects.json" \
            --output production/data/r2-media-coverage-report.json \
            --release-sha "$GITHUB_SHA"
          node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (d.status !== "pass" || d.release_sha !== process.argv[2] || d.missing_count !== 0) process.exit(1)' production/data/r2-media-coverage-report.json "$GITHUB_SHA"

      - name: Preserve exact R2 report for the Worker image
        uses: actions/upload-artifact@v4
        with:
          name: r2-media-coverage-${{ github.sha }}
          path: production/data/r2-media-coverage-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload and activate exact origin release
        run: |
          # Every command names itself and its exit code: two deploys in a row
          # died inside this step with exit 1 and not one line of output, which
          # left nothing to debug. Never let this step fail silently again.
          step() { echo "::group::$1"; shift; "$@" && rc=0 || rc=$?; echo "::endgroup::"; if [ "$rc" -ne 0 ]; then echo "FAILED ($rc): $*" >&2; exit "$rc"; fi; }
          archive="$RUNNER_TEMP/ms-realty-${GITHUB_SHA}.tar.gz"
          step "pack release archive" tar --exclude-vcs --exclude=node_modules --exclude=.next --exclude=.local-backups --exclude=.recovery-work -czf "$archive" .
          ls -l "$archive"
          df -h "$RUNNER_TEMP" | tail -1
          ssh_args=(-i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts")
          step "prepare incoming dir" ssh "${ssh_args[@]}" "root@$MS_REALTY_DEPLOY_HOST" 'install -d -m 0700 /opt/ms-realty/incoming; df -h /opt /var/lib/containerd 2>/dev/null | tail -2'
          step "upload archive" scp "${ssh_args[@]}" "$archive" "root@$MS_REALTY_DEPLOY_HOST:/opt/ms-realty/incoming/${GITHUB_SHA}.tar.gz"
          step "upload deploy script" scp "${ssh_args[@]}" production/scripts/deploy-production-review.sh "root@$MS_REALTY_DEPLOY_HOST:/opt/ms-realty/incoming/${GITHUB_SHA}.deploy.sh"
          step "activate release" ssh "${ssh_args[@]}" "root@$MS_REALTY_DEPLOY_HOST" "set -e; trap 'rm -f /opt/ms-realty/incoming/${GITHUB_SHA}.deploy.sh' EXIT; bash -x '/opt/ms-realty/incoming/${GITHUB_SHA}.deploy.sh' '$GITHUB_SHA' </dev/null; test \"\$(readlink -f /opt/ms-realty/current)\" = '/opt/ms-realty/releases/${GITHUB_SHA}'"

  deploy:
    name: Deploy production
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.event_name == 'repository_dispatch' &&
      github.event.action == 'auto_merge_deploy' &&
      github.event.client_payload.merge_sha == github.sha))
    needs: [check, deploy_origin]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MS_REALTY_ORIGIN_TOKEN: ${{ secrets.MS_REALTY_ORIGIN_TOKEN }}
      MS_REALTY_DEPLOY_HOST: ${{ vars.MS_REALTY_DEPLOY_HOST }}
      MS_REALTY_DEPLOY_KNOWN_HOSTS: ${{ secrets.MS_REALTY_DEPLOY_KNOWN_HOSTS }}
      MS_REALTY_DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.MS_REALTY_DEPLOY_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare pinned SSH identity for coordinated rollback
        run: |
          test -n "$MS_REALTY_DEPLOY_HOST"
          test -n "$MS_REALTY_DEPLOY_KNOWN_HOSTS"
          test -n "$MS_REALTY_DEPLOY_SSH_PRIVATE_KEY"
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$MS_REALTY_DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$MS_REALTY_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"

      - name: Restore exact R2 report from the origin release
        uses: actions/download-artifact@v4
        with:
          name: r2-media-coverage-${{ github.sha }}
          path: production/data

      - name: Verify exact R2 report for the Worker image
        run: >-
          node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (d.status !== "pass" || d.release_sha !== process.argv[2] || d.missing_count !== 0) process.exit(1)'
          production/data/r2-media-coverage-report.json "$GITHUB_SHA"

      - name: Require deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test "${#MS_REALTY_ORIGIN_TOKEN}" -ge 32

      - name: Capture active Worker version
        id: previous
        run: |
          status="$(npx --yes wrangler@4.117.0 deployments status --name ms-realty --json)"
          version="$(node -e 'const d=JSON.parse(process.argv[1]); const v=d.versions.find(({ percentage }) => percentage === 100); if (!v) process.exit(1); process.stdout.write(v.version_id)' "$status")"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set exact Container image marker
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";

          const marker = process.env.GITHUB_SHA;
          const placeholder = "__MS_REALTY_BUILD_MARKER__";
          const configPath = "wrangler.jsonc";
          if (!/^[0-9a-f]{40}$/i.test(marker)) throw new Error("GITHUB_SHA must be a full commit SHA");
          const config = fs.readFileSync(configPath, "utf8");
          if (config.split(placeholder).length !== 3) throw new Error("Expected Container and edge image marker placeholders");
          fs.writeFileSync(configPath, config.replaceAll(placeholder, marker));
          NODE

      - name: Validate Worker secret bindings
        run: |
          secrets="$(npx --yes wrangler@4.117.0 secret list --name ms-realty --format json)"
          node --input-type=module - "$secrets" <<'NODE'
          import fs from "node:fs";

          const rows = JSON.parse(process.argv[2]);
          if (!Array.isArray(rows) || !rows.every((row) => row && typeof row.name === "string")) {
            throw new Error("Worker secret list must contain secret names");
          }
          if (!rows.some(({ name }) => name === "MS_REALTY_ORIGIN_TOKEN")) {
            throw new Error("MS_REALTY_ORIGIN_TOKEN Worker secret is required");
          }

          const config = fs.readFileSync("wrangler.jsonc", "utf8");
          const varsSource = config.match(/"vars"\s*:\s*\{([\s\S]*?)^\s*\},/m)?.[1];
          if (varsSource === undefined) throw new Error("wrangler vars are required");
          const checkedInVars = new Set(
            [...varsSource.matchAll(/^\s*"([^"]+)"\s*:/gm)].map(([, name]) => name),
          );
          const allowedMigrationNames = new Set([
            "MS_REALTY_LEAD_DURABLE_STORE_ENABLED",
            "MS_REALTY_WORKSPACE_ID",
          ]);
          const collisions = rows
            .map(({ name }) => name)
            .filter((name) => checkedInVars.has(name));
          const unexpectedCollisions = collisions.filter((name) => !allowedMigrationNames.has(name));
          if (collisions.length > 2 || unexpectedCollisions.length > 0) {
            throw new Error(`Worker secret/var collisions are not allowlisted: ${unexpectedCollisions.join(", ")}`);
          }
          NODE

      - name: Deploy exact main commit
        id: deploy
        run: >-
          npx --yes wrangler@4.117.0 deploy
          --keep-vars
          --containers-rollout immediate
          --tag "$GITHUB_SHA"
          --message "Automated production deploy $GITHUB_SHA"

      - name: Verify deployed Worker
        run: |
          health_url="${{ needs.deploy_origin.outputs.workers_dev_url }}"
          ready_url="${health_url%/api/health}/api/ready"
          for attempt in $(seq 1 100); do
            if curl --fail --silent --show-error --max-time 20 --header "Cache-Control: no-cache" "$health_url" --output "$RUNNER_TEMP/health.json" &&
              node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); const expected=process.argv[2]; if (d.service !== "ms-realty" || d.status !== "ok" || d.build_marker !== expected || d.origin_build_marker !== expected) process.exit(1)' "$RUNNER_TEMP/health.json" "$GITHUB_SHA" &&
              curl --fail --silent --show-error --max-time 20 --header "Cache-Control: no-cache" "$ready_url" --output "$RUNNER_TEMP/ready.json" &&
              node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); if (d.service !== "ms-realty" || d.status !== "ready" || d.launch_ready !== true || !Array.isArray(d.blockers) || d.blockers.length !== 0) process.exit(1)' "$RUNNER_TEMP/ready.json"; then
              exit 0
            fi
            echo "Expected exact markers $GITHUB_SHA and ready status; attempt $attempt/100 did not match."
            sleep 10
          done
          exit 1

      - name: Roll back failed deployment
        if: failure() && needs.deploy_origin.outputs.previous_release != ''
        run: |
          previous_version="${{ steps.previous.outputs.version }}"
          previous_origin="${{ needs.deploy_origin.outputs.previous_release }}"
          install -d -m 0700 "$RUNNER_TEMP/ssh"
          printf '%s\n' "$MS_REALTY_DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/ssh/id_ed25519"
          printf '%s\n' "$MS_REALTY_DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/ssh/id_ed25519" "$RUNNER_TEMP/ssh/known_hosts"
          if [ -n "$previous_version" ]; then
            status="$(npx --yes wrangler@4.117.0 deployments status --name ms-realty --json)"
            version="$(node -e 'const d=JSON.parse(process.argv[1]); const v=d.versions.find(({ percentage }) => percentage === 100); if (!v) process.exit(1); process.stdout.write(v.version_id)' "$status")"
            if [ "$version" != "$previous_version" ]; then
              npx --yes wrangler@4.117.0 rollback "$previous_version" --name ms-realty --message "Automatic rollback after failed release verification for $GITHUB_SHA" --yes
              status="$(npx --yes wrangler@4.117.0 deployments status --name ms-realty --json)"
              version="$(node -e 'const d=JSON.parse(process.argv[1]); const v=d.versions.find(({ percentage }) => percentage === 100); if (!v) process.exit(1); process.stdout.write(v.version_id)' "$status")"
            fi
            test "$version" = "$previous_version"
          fi
          [[ "$previous_origin" =~ ^[0-9a-f]{40}$ ]]
          ssh_args=(-i "$RUNNER_TEMP/ssh/id_ed25519" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$RUNNER_TEMP/ssh/known_hosts")
          ssh "${ssh_args[@]}" "root@$MS_REALTY_DEPLOY_HOST" "set -e; release='$previous_origin'; target='/opt/ms-realty/releases/$previous_origin'; test -f \"\$target/.ms-realty-release-sha\"; test \"\$(cat \"\$target/.ms-realty-release-sha\")\" = \"\$release\"; link='/opt/ms-realty/.current-rollback-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'; ln -s \"\$target\" \"\$link\"; mv -Tf \"\$link\" /opt/ms-realty/current; cd \"\$target\"; MS_REALTY_ENV_FILE=/opt/ms-realty/shared/.env.production-review MS_REALTY_COMPOSE_OVERRIDE=production/docker-compose.production-review.yml MS_REALTY_BUILD_MARKER=\"\$release\" npm run docker:up; test \"\$(readlink -f /opt/ms-realty/current)\" = \"\$target\""
          health_url="${{ needs.deploy_origin.outputs.workers_dev_url }}"
          if [ -z "$health_url" ]; then health_url="https://ms-realty.ms-realty-bg.workers.dev/api/health"; fi
          ready_url="${health_url%/api/health}/api/ready"
          expected_marker="${{ needs.deploy_origin.outputs.previous_marker }}"
          expected_ready="${{ needs.deploy_origin.outputs.previous_ready }}"
          expected_blockers="${{ needs.deploy_origin.outputs.previous_blockers }}"
          for attempt in $(seq 1 100); do
            if curl --fail --silent --show-error --max-time 20 --header "Cache-Control: no-cache" "$health_url" --output "$RUNNER_TEMP/rollback-health.json"; then
              health_matches=false
              if [ -n "$expected_marker" ]; then
                if node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); const edge=process.argv[2], origin=process.argv[3]; if (d.service !== "ms-realty" || d.status !== "ok" || d.build_marker !== edge || d.origin_build_marker !== origin) process.exit(1)' "$RUNNER_TEMP/rollback-health.json" "$expected_marker" "$previous_origin"; then
                  health_matches=true
                fi
              elif node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); const origin=process.argv[2]; if (d.service !== "ms-realty" || d.status !== "ok" || (d.build_marker !== undefined && d.build_marker !== "unversioned") || d.origin_build_marker !== origin) process.exit(1)' "$RUNNER_TEMP/rollback-health.json" "$previous_origin"; then
                health_matches=true
              fi
              expected_ready_status=503
              if [ "$expected_ready" = "true" ]; then expected_ready_status=200; fi
              ready_status="$(curl --silent --show-error --max-time 20 --header "Cache-Control: no-cache" --output "$RUNNER_TEMP/rollback-ready.json" --write-out '%{http_code}' "$ready_url")"
              if [ "$health_matches" = true ] && [ "$ready_status" = "$expected_ready_status" ] &&
                node -e 'const d=JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); const ready=process.argv[2] === "true"; const blockers=process.argv[3] ? process.argv[3].split(",") : []; const actual=Array.isArray(d.blockers) ? [...d.blockers].sort() : []; if (d.service !== "ms-realty" || d.launch_ready !== ready || d.status !== (ready ? "ready" : "blocked") || JSON.stringify(actual) !== JSON.stringify(blockers)) process.exit(1)' "$RUNNER_TEMP/rollback-ready.json" "$expected_ready" "$expected_blockers"; then
                if [ -z "$expected_marker" ]; then
                  echo "Rollback target predates exact image markers; confirmed its legacy unversioned health response."
                fi
                exit 0
              fi
            fi
            echo "Rollback verification attempt $attempt/100 did not match the prior edge/origin markers and readiness."
            sleep 10
          done
          exit 1
