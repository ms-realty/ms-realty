name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NODE_ENV: production
      PAYLOAD_SECRET: ci-build-secret-not-a-real-secret-0123456789
      DATABASE_URL: postgresql://localhost:5432/ms_realty_ci
      MS_REALTY_ADMIN_TOKEN: ci-admin-token-not-a-real-secret-0123456789
      MS_REALTY_LEAD_CONTACT_KEY: ci-lead-contact-key-not-a-real-secret-0123
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Full check (tests + validation + next build)
        run: npm run check
