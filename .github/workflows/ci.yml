name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The test script sets MS_REALTY_ALLOW_INSECURE_LOCAL_ADMIN itself; the
      # smoke admin token is never accepted without that explicit opt-in.
      - name: Generate runtime reports (gitignored, tests expect them)
        run: npm run payload:runtime

      - name: Tests and validation
        run: npm test && npm run validate

      # next build sets NODE_ENV=production itself; Payload config wants
      # these present at build time. Dummy non-secret values, build-only.
      - name: Next.js production build
        run: npm run next:build
        env:
          PAYLOAD_SECRET: ci-build-secret-not-a-real-secret-0123456789
          DATABASE_URL: postgresql://localhost:5432/ms_realty_ci

      - name: Smoke built Next runtime
        run: npm run next:smoke
        env:
          PAYLOAD_SECRET: ci-build-secret-not-a-real-secret-0123456789
          DATABASE_URL: postgresql://localhost:5432/ms_realty_ci

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fails on any high/critical advisory that is not a dated, documented
      # exception in production/scripts/audit-dependencies.mjs.
      - name: Audit runtime dependencies
        run: npm run audit
