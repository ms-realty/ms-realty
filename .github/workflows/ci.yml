name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # No NODE_ENV/tokens here: the test suite relies on the local
      # non-production admin-token fallback and fixture defaults.
      - name: Generate runtime reports (gitignored, tests expect them)
        run: npm run payload:runtime

      - name: Tests and validation
        run: npm test && npm run validate

      # next build sets NODE_ENV=production itself; Payload config wants
      # these present at build time. Dummy non-secret values, build-only.
      - name: Next.js production build
        run: npm run next:build
        env:
          PAYLOAD_SECRET: ci-build-secret-not-a-real-secret-0123456789
          DATABASE_URL: postgresql://localhost:5432/ms_realty_ci
