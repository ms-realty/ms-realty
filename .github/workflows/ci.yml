# Every source, browser, visual and container check feeds the required `ci / gate`.
# Each browser profile owns a runner and disposable database; no fixture growth or
# job time limit can hide the delivery checks that follow the browser suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  repository_dispatch:
    types: [auto_merged]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source:
    uses: Mindburn-Labs/platform-actions/.github/workflows/ci.yml@v2
    with:
      setup-commands: |
        npm ci --prefix gateway --ignore-scripts --no-audit --no-fund
        docker run -d --name ci-postgres -e POSTGRES_PASSWORD=pg -p 5432:5432 postgres:16.14-alpine -c max_locks_per_transaction=256
        until docker exec ci-postgres pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
        echo "TEST_DATABASE_URL=postgres://postgres:pg@127.0.0.1:5432/postgres" >>"${GITHUB_ENV}"
      extra-commands: |
        node --test scripts/legacy-media-sources.test.mjs scripts/recovery-archive-plan.test.mjs
        node data/legacy/verify.mjs
        npm run tokens:check
        npm run openapi:generate
        npm run release:schemas
        git diff --exit-code -- docs/api/openapi.json release/schemas
        TEST_PRIVATE_TLS_FIXTURE=true npx vitest run --project integration src/db/transport-tls.int.test.ts src/db/connectivity-tls.int.test.ts src/server/recovery/startup-tls.int.test.ts --maxWorkers=1
        node --test scripts/ci-clamav.test.mjs
        node scripts/ci-clamav.mjs npm run test:integration -- src/server/files/workflow.int.test.ts src/server/documents/requests.int.test.ts

  browsers:
    name: Browser / ${{ matrix.profile }}
    needs: source
    # Keep browser OS dependencies reproducible across ubuntu-latest image migrations.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: chromium-desktop
            engine: chromium
          - profile: chromium-mobile
            engine: chromium
          - profile: webkit-mobile
            engine: webkit
    env:
      TEST_DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/postgres
      PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install locked dependencies
        timeout-minutes: 5
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix gateway --ignore-scripts --no-audit --no-fund
      - name: Install the profile browser runtime
        timeout-minutes: 10
        env:
          BROWSER_ENGINE: ${{ matrix.engine }}
        run: |
          # The hosted Azure HTTP mirror can stall on small OS packages. Keep the
          # same signed Ubuntu archive and package set through its HTTPS endpoint.
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources
          npx playwright install --with-deps "$BROWSER_ENGINE"
      - name: Start disposable PostgreSQL and build the candidate
        run: |
          docker run -d --name ci-postgres -e POSTGRES_PASSWORD=pg -p 5432:5432 postgres:16.14-alpine -c max_locks_per_transaction=256
          until docker exec ci-postgres pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
          npm run build
      - name: Complete the browser profile with the real scanner
        env:
          BROWSER_PROFILE: ${{ matrix.profile }}
        run: node scripts/ci-clamav.mjs npm run e2e -- --project="$BROWSER_PROFILE"
      - name: Verify isolated read-failure recovery
        if: matrix.profile == 'chromium-desktop'
        run: |
          E2E_TODAY_UNAVAILABLE=1 npx playwright test e2e/today-unavailable.spec.ts --workers=1 --project=chromium-desktop
          E2E_O03_UNAVAILABLE=1 npx playwright test e2e/inquiry-case-link.spec.ts --workers=1 --project=chromium-desktop --grep "a failed candidate read"
      - name: Verify analytics cannot read a shared-link token
        env:
          GTM_CONTAINER_ID: GTM-SYNTHETIC
          BROWSER_PROFILE: ${{ matrix.profile }}
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/${{ matrix.profile }}-analytics
        run: npx playwright test e2e/shared-shortlist.spec.ts --project="$BROWSER_PROFILE" --grep "a consented recipient page mounts no analytics" --workers=1 --retries=0
      - name: Preserve browser reports and failure traces
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.profile }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  delivery:
    name: Visual and container delivery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEST_DATABASE_URL: postgres://postgres:pg@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prepare container-smoke dependencies and disposable PostgreSQL
        run: |
          npm ci --no-audit --no-fund
          docker run -d --name ci-postgres -e POSTGRES_PASSWORD=pg -p 5432:5432 postgres:16.14-alpine -c max_locks_per_transaction=256
          until docker exec ci-postgres pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
      - name: Compare the pinned Linux visual baselines
        run: bash scripts/visual-docker.sh check
      - name: Build and exercise the delivery container
        run: |
          docker build --build-arg BUILD_SHA="$GITHUB_SHA" -t msr-delivery:ci .
          node scripts/container-smoke.mjs msr-delivery:ci
      - name: Preserve visual comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delivery-visuals
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  gate:
    name: ci / gate
    if: always()
    needs: [source, browsers, delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every source, browser and delivery check
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'has("source") and has("browsers") and has("delivery") and all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

  # Preserve the legacy branch-protection context as the same complete gate.
  required-check-alias:
    name: npm run check
    if: always()
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror ci / gate
        env:
          CI_RESULT: ${{ needs.gate.result }}
        run: test "${CI_RESULT}" = success
