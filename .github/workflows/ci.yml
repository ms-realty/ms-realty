# CI v2 contract: `ci` calls Mindburn-Labs/platform-actions ci.yml@v2.
#
# `ci` starts Postgres (the integration tests need TEST_DATABASE_URL and
# vitest.config.ts refuses to skip them under CI), runs `make check`, then
# Playwright e2e against that build, plus the diff-aware dependency scan. The
# required status check is `ci / gate`.
#
# Nothing here deploys (docs/plan.md §1). auto-merge.yml listens to this
# workflow by its name, CI.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:
  # auto-merge.yml merges with GITHUB_TOKEN, which fires no `push` run, so it
  # dispatches this event to test the merged main.
  repository_dispatch:
    types: [auto_merged]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: Mindburn-Labs/platform-actions/.github/workflows/ci.yml@v2
    with:
      setup-commands: |
        docker run -d --name ci-postgres -e POSTGRES_PASSWORD=pg -p 5432:5432 postgres:17-alpine
        until docker exec ci-postgres pg_isready -U postgres >/dev/null 2>&1; do sleep 1; done
        echo "TEST_DATABASE_URL=postgres://postgres:pg@127.0.0.1:5432/postgres" >>"${GITHUB_ENV}"
      # Under CI, playwright.config.ts starts the server without building;
      # `make check` has just built it.
      extra-commands: |
        npx playwright install --with-deps chromium
        make e2e

  # Branch protection on main still requires a check named "npm run check".
  # This job reports ci's result under that name so merges keep working.
  # Delete it once protection requires `ci / gate` instead.
  required-check-alias:
    name: npm run check
    if: always()
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Mirror ci / gate
        env:
          CI_RESULT: ${{ needs.ci.result }}
        run: test "${CI_RESULT}" = success
