name: Health check

on:
  schedule:
    # Hourly probe of the production Worker. GitHub emails the workflow author
    # on failure, which is the whole alerting mechanism — no external account.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    name: Probe /api/health
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe production health endpoint
        env:
          BASE_URL: ${{ vars.MS_REALTY_PRODUCTION_URL }}
        run: |
          test -n "$BASE_URL"
          response="$(curl --fail --silent --show-error --max-time 20 \
            --header "Cache-Control: no-cache" "$BASE_URL/api/health")"
          echo "$response"
          node -e 'const d=JSON.parse(process.argv[1]); if (d.service !== "ms-realty" || d.status !== "ok") { console.error("unhealthy"); process.exit(1); }' "$response"
