name: Health check

on:
  schedule:
    # Hourly probe of the production Worker. GitHub emails the workflow author
    # on failure, which is the whole alerting mechanism — no external account.
    - cron: "17 * * * *"
  workflow_dispatch:

# The probe script lives in this repository, so the job needs to read it.
# Nothing else: the probe only makes unauthenticated HTTP requests.
permissions:
  contents: read

jobs:
  probe:
    name: Probe production journeys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A healthy process can still serve broken pages, so this probes the
      # real journeys: home, the search fail-closed fallback, admin login and
      # its 401 boundary, legacy media, the noindex preview guard, and
      # readiness. No dependencies are installed — the script is stdlib only.
      - name: Probe production journeys
        env:
          MS_REALTY_PRODUCTION_URL: ${{ vars.MS_REALTY_PRODUCTION_URL }}
        run: |
          test -n "$MS_REALTY_PRODUCTION_URL"
          node production/scripts/probe-production-journeys.mjs
