name: Health check

on:
  schedule:
    # Hourly probe of the production Worker. GitHub emails the workflow author
    # on failure, which is the whole alerting mechanism — no external account.
    - cron: "17 * * * *"
  workflow_dispatch:

# The probe script lives in this repository, so the job needs to read it.
# Nothing else: the probe only makes unauthenticated HTTP requests.
permissions:
  contents: read

jobs:
  probe:
    name: Probe production journeys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # A healthy process can still serve broken pages, so this probes the
      # real journeys: home, the search fail-closed fallback, the public admin
      # route, legacy media, the production indexing posture, and readiness.
      # No dependencies are installed — the script is stdlib only.
      - name: Probe production journeys
        env:
          MS_REALTY_PRODUCTION_URL: https://ms-realty.ms-realty-bg.workers.dev
        run: |
          test "$MS_REALTY_PRODUCTION_URL" = "https://ms-realty.ms-realty-bg.workers.dev"
          node production/scripts/probe-production-journeys.mjs

      # The workers.dev origin can be perfectly healthy while the canonical
      # domain serves something else entirely: a second Worker on the zone took
      # every public URL on 2026-09-03 and closed the site behind a 503 for a
      # day, and this probe never looked. The canonical host is the one with the
      # search equity, so it is probed too, and its own indexing contract
      # (indexable, canonical links, sitemap on the real domain) is asserted by
      # the same script.
      - name: Probe canonical production journeys
        if: ${{ vars.MS_REALTY_PUBLIC_CONSTRUCTION_HOLD != 'true' }}
        env:
          MS_REALTY_PRODUCTION_URL: https://makler-realty.com
        run: |
          test "$MS_REALTY_PRODUCTION_URL" = "https://makler-realty.com"
          node production/scripts/probe-production-journeys.mjs

      - name: Verify the public construction hold
        if: ${{ vars.MS_REALTY_PUBLIC_CONSTRUCTION_HOLD == 'true' }}
        run: node production/scripts/probe-public-hold.mjs
