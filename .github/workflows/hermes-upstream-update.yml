name: Update Hermes Agent upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: hermes-upstream-update
  cancel-in-progress: false

env:
  HERMES_UPDATE_BRANCH: automation/hermes-agent-updater
  HERMES_PROVENANCE_PATH: production/data/hermes-upstream-provenance.json

jobs:
  update:
    name: Discover and propose stable Hermes release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare isolated updater branch
        id: branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if git fetch --no-tags origin "${HERMES_UPDATE_BRANCH}"; then
            lease="$(git rev-parse "refs/remotes/origin/${HERMES_UPDATE_BRANCH}")"
            remote_head="$lease"
            git switch --create "${HERMES_UPDATE_BRANCH}" --force "origin/${HERMES_UPDATE_BRANCH}"
            git merge --no-edit origin/main
          else
            lease="$(printf '%040d' 0)"
            remote_head="$lease"
            git switch --create "${HERMES_UPDATE_BRANCH}" --force origin/main
          fi
          {
            echo "lease=$lease"
            echo "remote_head=$remote_head"
          } >> "$GITHUB_OUTPUT"

      - name: Resolve official release, digest, and synchronized pins
        id: update
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HERMES_REMOTE_HEAD: ${{ steps.branch.outputs.remote_head }}
        shell: bash
        run: |
          set -euo pipefail
          npm run hermes:upstream:update
          # This is the only checked-in Hermes report regenerated by the updater.
          npm run hermes:provisioning
          git diff --check
          tracked_paths=(
            production/docker-compose.local-production.yml
            production/lib/hermes-provider-provisioning.mjs
            SOURCE_OF_TRUTH.md
            production/data/hermes-upstream-provenance.json
            production/data/hermes-provider-provisioning-report.json
          )
          if [ -n "$(git status --porcelain -- "${tracked_paths[@]}")" ]; then
            git add -- "${tracked_paths[@]}"
            git diff --cached --check
            git commit -m "chore: update Hermes Agent upstream pin"
          fi
          head_sha="$(git rev-parse HEAD)"
          if [ "$head_sha" = "$HERMES_REMOTE_HEAD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "changed=true"
            echo "head_sha=$head_sha"
            echo "release_tag=$(node --input-type=module -e 'import fs from "node:fs"; const d=JSON.parse(fs.readFileSync(process.env.HERMES_PROVENANCE_PATH, "utf8")); process.stdout.write(d.upstream.release.tag)')"
          } >> "$GITHUB_OUTPUT"

      - name: Push updater branch with a lease
        if: steps.update.outputs.changed == 'true'
        env:
          HERMES_REMOTE_LEASE: ${{ steps.branch.outputs.lease }}
        shell: bash
        run: |
          set -euo pipefail
          git push --force-with-lease="refs/heads/${HERMES_UPDATE_BRANCH}:${HERMES_REMOTE_LEASE}" origin "HEAD:${HERMES_UPDATE_BRANCH}"

      - name: Create or update same-repository pull request and dispatch full CI
        if: steps.update.outputs.changed == 'true'
        uses: actions/github-script@v7
        env:
          HERMES_UPDATE_BRANCH: ${{ env.HERMES_UPDATE_BRANCH }}
          HERMES_PROVENANCE_PATH: ${{ env.HERMES_PROVENANCE_PATH }}
          HERMES_HEAD_SHA: ${{ steps.update.outputs.head_sha }}
          HERMES_RELEASE_TAG: ${{ steps.update.outputs.release_tag }}
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require("node:fs");
            const provenance = JSON.parse(fs.readFileSync(process.env.HERMES_PROVENANCE_PATH, "utf8"));
            const { owner, repo } = context.repo;
            const branch = process.env.HERMES_UPDATE_BRANCH;
            const marker = "<!-- ms-realty:hermes-upstream-update -->";
            const title = "chore: update Hermes Agent to " + process.env.HERMES_RELEASE_TAG;
            const body = [
              marker,
              "## Official Hermes Agent upstream update",
              "",
              "This PR is generated only from a stable release published by the official NousResearch/hermes-agent repository. It stays open when the exact-image compatibility smoke fails.",
              "",
              "- GitHub release: [" + provenance.upstream.release.tag + "](" + provenance.upstream.release.url + ")",
              "- Release published: " + provenance.upstream.release.published_at,
              "- Release commit: [" + provenance.upstream.commit.sha + "](" + provenance.upstream.commit.url + ")",
              "- Docker image: " + provenance.managed_image,
              "- Docker manifest: [" + provenance.upstream.docker.digest + "](" + provenance.upstream.docker.manifest_url + ")",
              "",
              "The updater synchronizes the compose pin, provisioning source, and source-of-truth record, then regenerates only hermes-provider-provisioning-report.json.",
              "",
              "CI is dispatched explicitly because a GITHUB_TOKEN-created branch or PR does not recursively start the normal pull-request workflow. Auto-merge remains fenced to this branch marker, the exact CI head, and the passing Hermes compatibility smoke.",
              "",
              "Machine-readable provenance: production/data/hermes-upstream-provenance.json.",
            ].join("\n");
            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              base: "main",
              head: owner + ":" + branch,
              per_page: 10,
            });
            if (existing.length > 1) {
              core.setFailed("Expected at most one Hermes updater PR, found " + existing.length + ".");
              return;
            }
            let pull;
            if (existing.length === 1) {
              ({ data: pull } = await github.rest.pulls.update({
                owner,
                repo,
                pull_number: existing[0].number,
                title,
                body,
              }));
            } else {
              ({ data: pull } = await github.rest.pulls.create({
                owner,
                repo,
                head: branch,
                base: "main",
                title,
                body,
              }));
            }
            if (pull.head?.repo?.full_name !== owner + "/" + repo || pull.base?.ref !== "main") {
              core.setFailed("Hermes updater PR must be same-repository and target main.");
              return;
            }
            core.setOutput("pull_request_number", String(pull.number));
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: "ci.yml",
              ref: branch,
              inputs: {
                hermes_update: "true",
                pull_request_number: String(pull.number),
                expected_head_sha: process.env.HERMES_HEAD_SHA,
                release_tag: process.env.HERMES_RELEASE_TAG,
              },
            });
            core.notice("Dispatched full CI for Hermes updater PR #" + pull.number + " at " + process.env.HERMES_HEAD_SHA + ".");
