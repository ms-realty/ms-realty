name: Capture R2 media evidence

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Full SHA currently serving at both the Worker and origin
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: r2-media-evidence
  cancel-in-progress: false

jobs:
  capture:
    name: Verify the deployed release's R2 inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bind the capture to the deployed main release
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          curl --fail --silent --show-error --max-time 20 \
            --header 'Cache-Control: no-cache' \
            https://ms-realty.ms-realty-bg.workers.dev/api/health \
            --output "$RUNNER_TEMP/health-before.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const d = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/health-before.json`, 'utf8'));
          if (d.service !== 'ms-realty' || d.status !== 'ok' ||
              d.build_marker !== process.env.RELEASE_SHA || d.origin_build_marker !== process.env.RELEASE_SHA) {
            throw new Error('The requested release must be serving at both layers');
          }
          NODE
          git checkout --detach "$RELEASE_SHA"

      - name: List objects and build the exact-release report
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node production/scripts/repair-missing-r2-media.mjs \
            --list-only \
            --listing-output "$RUNNER_TEMP/r2-media-objects.json"
          node production/scripts/build-r2-media-coverage.mjs \
            --input "$RUNNER_TEMP/r2-media-objects.json" \
            --output "$RUNNER_TEMP/r2-media-coverage-report.json" \
            --release-sha "$RELEASE_SHA"

      - name: Verify coverage and unchanged release markers
        run: |
          curl --fail --silent --show-error --max-time 20 \
            --header 'Cache-Control: no-cache' \
            https://ms-realty.ms-realty-bg.workers.dev/api/health \
            --output "$RUNNER_TEMP/health-after.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const read = name => JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${name}`, 'utf8'));
          const report = read('r2-media-coverage-report.json');
          const health = read('health-after.json');
          if (report.status !== 'pass' || report.missing_count !== 0 ||
              report.release_sha !== process.env.RELEASE_SHA ||
              !Number.isFinite(Date.parse(report.generated_at))) {
            throw new Error('Coverage must pass for the exact deployed release');
          }
          if (health.service !== 'ms-realty' || health.status !== 'ok' ||
              health.build_marker !== process.env.RELEASE_SHA || health.origin_build_marker !== process.env.RELEASE_SHA) {
            throw new Error('The deployed release changed during capture');
          }
          NODE

      - name: Save credential-free evidence
        uses: actions/upload-artifact@v4
        with:
          name: r2-media-evidence-${{ inputs.release_sha }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/r2-media-objects.json
            ${{ runner.temp }}/r2-media-coverage-report.json
            ${{ runner.temp }}/health-before.json
            ${{ runner.temp }}/health-after.json
          if-no-files-found: error
          retention-days: 7
