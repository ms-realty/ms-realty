name: Repair R2 media coverage

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-media-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      # The legacy app left main in the rebuild (docs/plan.md). This workflow still serves
      # the live legacy deployment, so it runs the scripts frozen at tag legacy-app-final.
      - uses: actions/checkout@v4
        with:
          ref: legacy-app-final

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Repair exact missing objects and capture credential-free listing
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          node production/scripts/repair-missing-r2-media.mjs \
            --execute \
            --listing-output "$RUNNER_TEMP/r2-media-objects.json"

      - name: Upload credential-free R2 listing
        uses: actions/upload-artifact@v4
        with:
          name: r2-media-objects-${{ github.sha }}
          path: ${{ runner.temp }}/r2-media-objects.json
          if-no-files-found: error
          retention-days: 7
