name: MS Realty Cloudflare staging

on:
  workflow_dispatch:
  push:
    branches: [codex/msr-staging]

permissions:
  contents: read

concurrency:
  group: ms-realty-cloudflare-staging
  cancel-in-progress: false

jobs:
  inventory:
    name: Read the MS Realty Cloudflare account
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Capture resources without changing DNS or routes
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/cloudflare-inventory.mjs \
            --json deploy/evidence/cloudflare-inventory.json \
            --markdown deploy/evidence/CLOUDFLARE-INVENTORY.md
      - name: Preserve the redacted inventory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ms-realty-cloudflare-inventory-${{ github.run_id }}
          path: deploy/evidence/
          if-no-files-found: warn
          retention-days: 30
      # Inventory is retained as the run artifact. Never advance the qualified
      # staging ref with generated evidence after its exact source was deployed.
