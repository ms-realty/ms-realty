<!-- @dsCard group="Components" viewport="700x560" name="Data" subtitle="Stat KPI tiles, sortable DataTable, activity Timeline" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; }
  .wrap { padding: 20px 22px; display: flex; flex-direction: column; gap: 18px; }
  .lbl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--text-muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .split { display: grid; grid-template-columns: 1fr 260px; gap: 18px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card); box-shadow: var(--shadow-card); overflow: hidden; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script type="text/babel">
  const { Stat, DataTable, Timeline } = window.MaklerRealtyDesignSystem_9b7f1e;
  const eur = (v) => '€' + v.toLocaleString('en-GB');
  const rows = [
    { id: 1, ref: 'MS-2214', title: 'Двустаен, Marina Cape', area: 68,  price: 245000 },
    { id: 2, ref: 'MS-1187', title: 'Къща с двор, Сандански', area: 142, price: 189000 },
    { id: 3, ref: 'MS-0954', title: 'Студио, Банско',         area: 41,  price: 62500 },
    { id: 4, ref: 'MS-2301', title: 'Вила, Несебър',          area: 210, price: 415000 },
  ];
  function Demo() {
    return (
      <>
        <div className="stats">
          <Stat label="Активни имоти" value="132" icon="building-2" />
          <Stat label="Продажби Q2" value="€4.2M" icon="banknote" delta="+12%" trend="up" note="спрямо Q1" />
          <Stat label="Дни до сделка" value="27" icon="clock" delta="−3" trend="up" note="средно" />
        </div>
        <div className="split">
          <div>
            <div className="lbl" style={{marginBottom:8}}>DataTable</div>
            <div className="panel">
              <DataTable
                onRowClick={()=>{}}
                columns={[
                  { key: 'ref',   label: 'Реф.',  width: 92, render: r => <span className="mk-tbl__mono">{r.ref}</span> },
                  { key: 'title', label: 'Имот',  render: r => <span className="mk-tbl__primary">{r.title}</span> },
                  { key: 'area',  label: 'Площ',  align: 'right', render: r => r.area + ' m²', sort: r => r.area },
                  { key: 'price', label: 'Цена',  align: 'right', render: r => <span className="mk-tbl__price">{eur(r.price)}</span>, sort: r => r.price },
                ]}
                rows={rows}
              />
            </div>
          </div>
          <div>
            <div className="lbl" style={{marginBottom:8}}>Timeline</div>
            <Timeline items={[
              { icon: 'phone', text: <><b>Мария</b> проведе разговор с Й. ван дер Берг</>, meta: 'днес, 10:20' },
              { icon: 'calendar-days', text: <>Оглед на <b>MS-2214</b> в събота</>, meta: 'вчера' },
              { icon: 'trending-down', tone: 'brick', text: <><b>MS-1187</b> — цена намалена на €189,000</>, meta: '2 юли' },
              { icon: 'file-check', tone: 'success', text: <>Договор подписан — <b>MS-0954</b></>, meta: '28 юни' },
            ]} />
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
