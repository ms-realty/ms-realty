<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; }
  .wrap { padding: 24px 26px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; align-items: start; }
  .col { display: flex; flex-direction: column; gap: 14px; }
  .inline { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script type="text/babel">
  const { Input, Select, Textarea, RangeSlider, Checkbox, Radio, Switch } = window.MaklerRealtyDesignSystem_9b7f1e;
  const eur = (v) => '€' + v.toLocaleString('en-GB');
  function Demo() {
    return (
      <>
        <div className="col">
          <Input label="Пълно име" placeholder="Иван Петров" defaultValue="Иван Петров" />
          <Input label="Имейл" iconStart="mail" placeholder="you@email.com" />
          <Input label="Бюджет" iconStart="search" error="Въведете валидна сума" defaultValue="abc" />
          <Textarea label="Съобщение" rows={3} placeholder="Кажете ни какво търсите — локация, бюджет, изисквания…" hint="Отговаряме до един работен ден." />
        </div>
        <div className="col">
          <Select label="Тип имот" iconStart="house"
            options={['Апартамент','Къща','Вила','Студио','Парцел']} defaultValue="Вила" />
          <Select label="Курорт" placeholder="Изберете локация"
            options={['Сандански','Банско','Слънчев бряг','Свети Влас','Нафплио']} />
          <RangeSlider label="Цена" min={20000} max={600000} step={5000} defaultValue={[60000, 245000]} format={eur} />
          <div className="inline">
            <Checkbox label="Изглед море" defaultChecked />
            <Checkbox label="Басейн" />
            <Radio name="d" label="Купува" defaultChecked />
            <Radio name="d" label="Под наем" />
            <Switch label="Известия" defaultChecked />
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
