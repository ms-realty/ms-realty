<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; }
  .wrap { padding: 26px 26px; display: flex; flex-direction: column; gap: 22px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script type="text/babel">
  const { Breadcrumb, Pagination, Tabs, LangSwitcher } = window.MaklerRealtyDesignSystem_9b7f1e;
  function Demo() {
    const [page, setPage] = React.useState(4);
    const [tab, setTab] = React.useState('overview');
    const [view, setView] = React.useState('grid');
    const [lang, setLang] = React.useState('EN');
    return (
      <>
        <Breadcrumb items={[
          { label: 'Начало', href: '#' },
          { label: 'Продажба', href: '#' },
          { label: 'Бургас', href: '#' },
          { label: 'Свети Влас' },
        ]} />
        <Tabs value={tab} onChange={setTab} items={[
          { key: 'overview', label: 'Преглед' },
          { key: 'features', label: 'Характеристики' },
          { key: 'location', label: 'Локация', icon: 'map-pin' },
          { key: 'similar',  label: 'Подобни', count: 6 },
        ]} />
        <div style={{ display: 'flex', gap: 16, alignItems: 'center' }}>
          <Tabs variant="segmented" size="sm" value={view} onChange={setView} items={[
            { key: 'grid', label: 'Решетка' }, { key: 'list', label: 'Списък' }, { key: 'map', label: 'Карта' },
          ]} />
          <LangSwitcher value={lang} onChange={setLang} />
        </div>
        <Pagination page={page} totalPages={18} onChange={setPage} />
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
