<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>*,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff;-webkit-font-smoothing:antialiased}
  .pad{padding:20px 24px}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sw i{display:block;height:60px;border-radius:10px;border:1px solid rgba(22,19,14,.07)}
  .sw b{font:600 12px var(--font-mono);color:var(--text-strong)}
  .sw em{font:400 10px var(--font-mono);color:var(--text-muted);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph{display:flex;gap:10px}
  .ph div{flex:1;display:flex;flex-direction:column;gap:7px}
  .ph i{height:78px;border-radius:11px}
  .ph code{font:400 10px var(--font-mono);color:var(--text-muted);text-align:center}</style>
</head>
<body>
<div class="pad"><div class="ph">
    <div><i class="mk-photo mk-photo--sea"></i><code>sea</code></div><div><i class="mk-photo mk-photo--sky"></i><code>sky</code></div><div><i class="mk-photo mk-photo--sand"></i><code>sand</code></div><div><i class="mk-photo mk-photo--sunset"></i><code>sunset</code></div><div><i class="mk-photo mk-photo--pine"></i><code>pine</code></div><div><i class="mk-photo mk-photo--night"></i><code>night</code></div>
  </div></div>
</body>
</html>
