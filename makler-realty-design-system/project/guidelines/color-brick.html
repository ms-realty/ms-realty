<!-- @dsCard group="Colors" viewport="720x188" name="Brick — accent (logo red)" subtitle="The logo red, anchored on the official Jasper. The single high-intent CTA + 'reduced' flag." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>*,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff;-webkit-font-smoothing:antialiased}
  .pad{padding:18px 24px;display:flex;flex-direction:column;gap:12px}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sw i{display:block;height:56px;border-radius:10px;border:1px solid rgba(22,19,14,.07)}
  .sw--star i{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--ink-600)}
  .sw b{font:600 12px var(--font-mono);color:var(--text-strong)}
  .sw em{font:400 10px var(--font-mono);color:var(--text-muted);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .named{display:flex;gap:20px;font:400 11px var(--font-mono);color:var(--text-muted)}
  .named span{display:inline-flex;align-items:center;gap:7px}
  .named i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .named b{color:var(--text-strong);font-weight:600}
</style>
</head>
<body>
<div class="pad">
    <div class="ramp"><div class="sw"><i style="background:var(--brick-50)"></i><b>50</b><em>#FCEBEB</em></div><div class="sw"><i style="background:var(--brick-100)"></i><b>100</b><em>#F9D4D4</em></div><div class="sw"><i style="background:var(--brick-200)"></i><b>200</b><em>#F3ADAD</em></div><div class="sw sw--star"><i style="background:var(--brick-300)"></i><b>300</b><em>#ED8484</em></div><div class="sw"><i style="background:var(--brick-400)"></i><b>400</b><em>#E45D5D</em></div><div class="sw sw--star"><i style="background:var(--brick-500)"></i><b>500</b><em>#DB3E3E</em></div><div class="sw"><i style="background:var(--brick-600)"></i><b>600</b><em>#C42D2D</em></div><div class="sw"><i style="background:var(--brick-700)"></i><b>700</b><em>#A32323</em></div><div class="sw"><i style="background:var(--brick-800)"></i><b>800</b><em>#7F1B1B</em></div><div class="sw"><i style="background:var(--brick-900)"></i><b>900</b><em>#571212</em></div></div>
    <div class="named"><span><i style="background:var(--brick-500)"></i><b>Jasper</b> #DB3E3E · official brand red (500)</span><span><i style="background:var(--brick-300)"></i><b>Apple&nbsp;Valley</b> #ED8484 · official light red (300)</span></div>
  </div>
</body>
</html>
