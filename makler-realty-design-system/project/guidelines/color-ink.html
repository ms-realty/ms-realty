<!-- @dsCard group="Colors" viewport="770x188" name="Ink — brand (charcoal)" subtitle="Near-neutral charcoal from the 'REAL·TY' wordmark; 600 = official Bauhaus. The brand workhorse." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>*,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff;-webkit-font-smoothing:antialiased}
  .pad{padding:18px 24px;display:flex;flex-direction:column;gap:12px}
  .ramp{display:flex;gap:7px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sw i{display:block;height:56px;border-radius:10px;border:1px solid rgba(22,19,14,.07)}
  .sw--star i{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--brick-500)}
  .sw b{font:600 12px var(--font-mono);color:var(--text-strong)}
  .sw em{font:400 9px var(--font-mono);color:var(--text-muted);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .named{display:flex;gap:20px;font:400 11px var(--font-mono);color:var(--text-muted)}
  .named span{display:inline-flex;align-items:center;gap:7px}
  .named i{width:11px;height:11px;border-radius:3px;display:inline-block}
  .named b{color:var(--text-strong);font-weight:600}
</style>
</head>
<body>
<div class="pad">
    <div class="ramp"><div class="sw"><i style="background:var(--ink-50)"></i><b>50</b><em>#F4F4F3</em></div><div class="sw"><i style="background:var(--ink-100)"></i><b>100</b><em>#E6E6E5</em></div><div class="sw"><i style="background:var(--ink-200)"></i><b>200</b><em>#C9C9C7</em></div><div class="sw"><i style="background:var(--ink-300)"></i><b>300</b><em>#A6A6A4</em></div><div class="sw"><i style="background:var(--ink-400)"></i><b>400</b><em>#7A7A78</em></div><div class="sw"><i style="background:var(--ink-500)"></i><b>500</b><em>#545453</em></div><div class="sw sw--star"><i style="background:var(--ink-600)"></i><b>600</b><em>#3F3F3F</em></div><div class="sw"><i style="background:var(--ink-700)"></i><b>700</b><em>#2E2E2E</em></div><div class="sw"><i style="background:var(--ink-800)"></i><b>800</b><em>#222222</em></div><div class="sw"><i style="background:var(--ink-900)"></i><b>900</b><em>#181818</em></div><div class="sw"><i style="background:var(--ink-950)"></i><b>950</b><em>#0E0E0E</em></div></div>
    <div class="named"><span><i style="background:var(--ink-600)"></i><b>Bauhaus</b> #3F3F3F · official brand charcoal (600)</span><span><i style="background:var(--ink-800)"></i><b>--brand</b> = ink-800 · buttons &amp; headings</span></div>
  </div>
</body>
</html>
