<!-- @dsCard group="Colors" viewport="700x150" name="Sea — reserved" subtitle="Deep marine green-blue. Retired from default use in the monochrome push — ramp kept for opt-in." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>*,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff;-webkit-font-smoothing:antialiased}
  .pad{padding:20px 24px}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sw i{display:block;height:60px;border-radius:10px;border:1px solid rgba(22,19,14,.07)}
  .sw b{font:600 12px var(--font-mono);color:var(--text-strong)}
  .sw em{font:400 10px var(--font-mono);color:var(--text-muted);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="pad"><div class="ramp"><div class="sw"><i style="background:var(--sea-50)"></i><b>50</b><em>#ECF3F2</em></div><div class="sw"><i style="background:var(--sea-100)"></i><b>100</b><em>#D2E3E1</em></div><div class="sw"><i style="background:var(--sea-200)"></i><b>200</b><em>#A6C7C4</em></div><div class="sw"><i style="background:var(--sea-300)"></i><b>300</b><em>#71A29E</em></div><div class="sw"><i style="background:var(--sea-400)"></i><b>400</b><em>#467D79</em></div><div class="sw"><i style="background:var(--sea-500)"></i><b>500</b><em>#2C615E</em></div><div class="sw"><i style="background:var(--sea-600)"></i><b>600</b><em>#204B49</em></div><div class="sw"><i style="background:var(--sea-700)"></i><b>700</b><em>#183B39</em></div><div class="sw"><i style="background:var(--sea-800)"></i><b>800</b><em>#122C2B</em></div><div class="sw"><i style="background:var(--sea-900)"></i><b>900</b><em>#0D2120</em></div><div class="sw"><i style="background:var(--sea-950)"></i><b>950</b><em>#071413</em></div></div></div>
</body>
</html>
