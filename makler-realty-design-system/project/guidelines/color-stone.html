<!-- @dsCard group="Colors" viewport="700x150" name="Stone — warm neutral" subtitle="Limestone & sand. Surfaces, text, borders." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>*,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff;-webkit-font-smoothing:antialiased}
  .pad{padding:20px 24px}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sw i{display:block;height:60px;border-radius:10px;border:1px solid rgba(22,19,14,.07)}
  .sw b{font:600 12px var(--font-mono);color:var(--text-strong)}
  .sw em{font:400 10px var(--font-mono);color:var(--text-muted);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<div class="pad"><div class="ramp"><div class="sw"><i style="background:var(--stone-50)"></i><b>50</b><em>#FAF7F1</em></div><div class="sw"><i style="background:var(--stone-100)"></i><b>100</b><em>#F2ECE1</em></div><div class="sw"><i style="background:var(--stone-200)"></i><b>200</b><em>#E6DCCB</em></div><div class="sw"><i style="background:var(--stone-300)"></i><b>300</b><em>#D3C4AC</em></div><div class="sw"><i style="background:var(--stone-400)"></i><b>400</b><em>#B7A585</em></div><div class="sw"><i style="background:var(--stone-500)"></i><b>500</b><em>#948263</em></div><div class="sw"><i style="background:var(--stone-600)"></i><b>600</b><em>#73644A</em></div><div class="sw"><i style="background:var(--stone-700)"></i><b>700</b><em>#574B38</em></div><div class="sw"><i style="background:var(--stone-800)"></i><b>800</b><em>#3A3227</em></div><div class="sw"><i style="background:var(--stone-900)"></i><b>900</b><em>#241F18</em></div><div class="sw"><i style="background:var(--stone-950)"></i><b>950</b><em>#16130E</em></div></div></div>
</body>
</html>
