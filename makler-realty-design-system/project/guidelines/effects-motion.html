<!-- @dsCard group="Effects" viewport="700x190" name="Motion" subtitle="Durations & easing. Eases OUT; no chrome bounce." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>*,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff;-webkit-font-smoothing:antialiased}
  .pad{padding:20px 24px}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sw i{display:block;height:60px;border-radius:10px;border:1px solid rgba(22,19,14,.07)}
  .sw b{font:600 12px var(--font-mono);color:var(--text-strong)}
  .sw em{font:400 10px var(--font-mono);color:var(--text-muted);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mo{display:flex;gap:30px}
  .col{flex:1}
  .col h5{margin:0 0 8px;font:600 10px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
  .col .r{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:12px;color:var(--text-strong);padding:3px 0}
  .col .r span{color:var(--text-muted)}
  .track{position:relative;height:8px;background:var(--surface-sunken);border-radius:999px;margin:14px 0 6px;overflow:hidden}
  .dot{position:absolute;top:-4px;left:0;width:16px;height:16px;border-radius:50%;background:var(--accent);animation:run 2.4s var(--ease-out) infinite}
  @keyframes run{0%{left:0}50%{left:calc(100% - 16px)}100%{left:0}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none;left:calc(100% - 16px)}}</style>
</head>
<body>
<div class="pad"><div class="mo">
    <div class="col"><h5>Duration</h5>
      <div class="r"><span>fast</span>140ms</div>
      <div class="r"><span>base</span>220ms</div>
      <div class="r"><span>slow</span>340ms</div>
    </div>
    <div class="col"><h5>Easing — ease-out</h5>
      <div class="track"><div class="dot"></div></div>
      <div class="r"><span>standard</span>0.2,0,0,1</div>
      <div class="r"><span>out</span>0.16,1,0.3,1</div>
    </div>
  </div></div>
</body>
</html>
