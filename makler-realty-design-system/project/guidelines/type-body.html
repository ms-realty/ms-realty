<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>*,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff;-webkit-font-smoothing:antialiased}
  .pad{padding:20px 24px}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sw i{display:block;height:60px;border-radius:10px;border:1px solid rgba(22,19,14,.07)}
  .sw b{font:600 12px var(--font-mono);color:var(--text-strong)}
  .sw em{font:400 10px var(--font-mono);color:var(--text-muted);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.p{font-family:var(--font-sans);font-size:16px;line-height:1.6;color:var(--text-body);max-width:60ch}
  .w{display:flex;gap:22px;flex-wrap:wrap;margin-top:16px}
  .w span{font-size:19px}
  .w em{display:block;font:400 10px var(--font-mono);color:var(--text-muted);font-style:normal;margin-top:2px}</style>
</head>
<body>
<div class="pad">
    <p class="p">A low-contrast humanist grotesque with Latin, Cyrillic, Greek and Hebrew fallback — MS's voice reads consistently in Sofia, Bansko, Nafplio and Hebrew/Israel pages.</p>
    <div class="w">
      <span style="font-weight:300">Aa 300<em>Light</em></span>
      <span style="font-weight:400">Aa 400<em>Regular</em></span>
      <span style="font-weight:500">Aa 500<em>Medium</em></span>
      <span style="font-weight:600">Aa 600<em>Semibold</em></span>
      <span style="font-weight:700">Aa 700<em>Bold</em></span>
    </div>
  </div>
</body>
</html>
