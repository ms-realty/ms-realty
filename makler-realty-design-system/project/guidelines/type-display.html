<!-- @dsCard group="Type" viewport="700x250" name="Display — Source Serif 4" subtitle="Editorial headlines, property names, prices." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>*,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff;-webkit-font-smoothing:antialiased}
  .pad{padding:20px 24px}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sw i{display:block;height:60px;border-radius:10px;border:1px solid rgba(22,19,14,.07)}
  .sw b{font:600 12px var(--font-mono);color:var(--text-strong)}
  .sw em{font:400 10px var(--font-mono);color:var(--text-muted);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d{font-family:var(--font-display);color:var(--text-strong);letter-spacing:var(--tracking-tight);line-height:1.05}
  .d1{font-size:56px;font-weight:600}
  .d2{font-size:34px;font-weight:600;margin-top:10px}
  .d3{font-size:22px;font-weight:500;color:var(--text-body);margin-top:10px}
  .meta{margin-top:14px;font:400 11px var(--font-mono);color:var(--text-muted)}</style>
</head>
<body>
<div class="pad">
    <div class="d d1">Живей до морето</div>
    <div class="d d2">Homes by the Black Sea &amp; Aegean</div>
    <div class="d d3">Σπίτια δίπλα στη θάλασσα · Regular / Medium / Semibold</div>
    <div class="meta">--font-display · opsz 8–60 · Latin · Cyrillic · Greek</div>
  </div>
</body>
</html>
