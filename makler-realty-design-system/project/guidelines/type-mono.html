<!-- @dsCard group="Type" viewport="700x150" name="Mono — IBM Plex Mono" subtitle="Reference codes, m² specs, tabular data." -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>*,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);color:var(--text-body);background:#fff;-webkit-font-smoothing:antialiased}
  .pad{padding:20px 24px}
  .lbl{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-muted)}
  .ramp{display:flex;gap:8px}
  .sw{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
  .sw i{display:block;height:60px;border-radius:10px;border:1px solid rgba(22,19,14,.07)}
  .sw b{font:600 12px var(--font-mono);color:var(--text-strong)}
  .sw em{font:400 10px var(--font-mono);color:var(--text-muted);font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{font-family:var(--font-mono);color:var(--text-strong)}
  .m .row{display:flex;gap:26px;font-size:15px;margin-bottom:8px}
  .m .row span{color:var(--text-muted)}
  .m b{color:var(--price);font-weight:600;font-size:18px}</style>
</head>
<body>
<div class="pad m">
    <div class="row"><span>REF</span> MK-2043 &nbsp;·&nbsp; MK-1180 &nbsp;·&nbsp; MK-0975</div>
    <div class="row"><span>SPEC</span> 68 m² &nbsp;·&nbsp; 2 bed &nbsp;·&nbsp; 1 bath &nbsp;·&nbsp; floor 3/5</div>
    <div class="row"><span>PRICE</span> <b>€245,000</b> &nbsp;·&nbsp; €900/mo</div>
  </div>
</body>
</html>
