name: ms-realty-production-review

services:
  app:
    build:
      args:
        MS_REALTY_BUILD_MARKER: ${MS_REALTY_BUILD_MARKER:-unversioned}
    environment:
      HERMES_API_KEY: ${HERMES_API_KEY:-${HERMES_AGENT_API_SERVER_KEY:?HERMES_AGENT_API_SERVER_KEY is required}}
      HERMES_CHAT_COMPLETIONS_URL: ${HERMES_CHAT_COMPLETIONS_URL:-http://hermes-agent:8642/v1/chat/completions}
      HERMES_MODEL: ${HERMES_MODEL:-qwen3.5:0.8b}
      HERMES_PROVIDER_MODE: ${HERMES_PROVIDER_MODE:-self_hosted}
      MS_REALTY_ADMIN_ACTOR: ${MS_REALTY_ADMIN_ACTOR:-agency_admin}
      MS_REALTY_ADMIN_RUNTIME_VOLUME_ENABLED: "true"
      MS_REALTY_CASE_PAYLOAD_AUTHORITY_ENABLED: "true"
      MS_REALTY_CASE_REQUEST_PROJECTION_ENABLED: "false"
      MS_REALTY_EVENT_DURABLE_STORE_ENABLED: "true"
      MS_REALTY_HERMES_AGENT_EVIDENCE_SCOPE: live
      MS_REALTY_LEAD_DURABLE_STORE_ENABLED: "true"
      MS_REALTY_LEAD_OPS_DURABLE_STORE_ENABLED: "true"
      MS_REALTY_DEPLOYMENT_SCOPE: production
      MS_REALTY_LAUNCH_READINESS_OUTPUT_PATH: /runtime-evidence/production-launch-readiness.json
      MS_REALTY_R2_MEDIA_COVERAGE_REPORT_PATH: /app/production/data/r2-media-coverage-report.json
      MS_REALTY_MCP_DURABLE_LISTING_WRITES: "1"
      MS_REALTY_ORIGIN_TOKEN: ${MS_REALTY_ORIGIN_TOKEN:?MS_REALTY_ORIGIN_TOKEN is required}
      MS_REALTY_MEDIA_UPLOAD_DRIVER: r2
      MS_REALTY_MEDIA_UPLOAD_HOST: ms-realty.ms-realty-bg.workers.dev
      MS_REALTY_MEDIA_UPLOAD_R2_ENDPOINT: https://ms-realty.ms-realty-bg.workers.dev/__media/
      MS_REALTY_GOOGLE_OAUTH_CLIENT_ID: ${MS_REALTY_GOOGLE_OAUTH_CLIENT_ID:-}
      MS_REALTY_GOOGLE_OAUTH_CLIENT_SECRET: ${MS_REALTY_GOOGLE_OAUTH_CLIENT_SECRET:-}
      MS_REALTY_GITHUB_OAUTH_CLIENT_ID: ${MS_REALTY_GITHUB_OAUTH_CLIENT_ID:-}
      MS_REALTY_GITHUB_OAUTH_CLIENT_SECRET: ${MS_REALTY_GITHUB_OAUTH_CLIENT_SECRET:-}
      MS_REALTY_META_APP_ID: ${MS_REALTY_META_APP_ID:-}
      MS_REALTY_META_APP_SECRET: ${MS_REALTY_META_APP_SECRET:-}
      MS_REALTY_META_EMBEDDED_SIGNUP_CONFIG_ID: ${MS_REALTY_META_EMBEDDED_SIGNUP_CONFIG_ID:-}
      MS_REALTY_META_GRAPH_VERSION: ${MS_REALTY_META_GRAPH_VERSION:-}
      MS_REALTY_META_WEBHOOK_VERIFY_TOKEN: ${MS_REALTY_META_WEBHOOK_VERIFY_TOKEN:-}
      MS_REALTY_PROVIDER_OAUTH_STATE_SECRET: ${MS_REALTY_PROVIDER_OAUTH_STATE_SECRET:?MS_REALTY_PROVIDER_OAUTH_STATE_SECRET is required}
      MS_REALTY_PROVIDER_TOKEN_KEY: ${MS_REALTY_PROVIDER_TOKEN_KEY:?MS_REALTY_PROVIDER_TOKEN_KEY is required}
      MS_REALTY_PROVIDER_WEBHOOK_MAX_BYTES: ${MS_REALTY_PROVIDER_WEBHOOK_MAX_BYTES:-1048576}
      MS_REALTY_PUBLIC_CONTACT_KEY: ${MS_REALTY_PUBLIC_CONTACT_KEY:?MS_REALTY_PUBLIC_CONTACT_KEY is required}
      MS_REALTY_RECOVERY_SIGNING_PUBLIC_KEY: ${MS_REALTY_RECOVERY_SIGNING_PUBLIC_KEY:?MS_REALTY_RECOVERY_SIGNING_PUBLIC_KEY is required}
      MS_REALTY_RUNTIME_DATA_AUTHORITY: payload
      MS_REALTY_TRUST_PROXY: "1"
      MS_REALTY_VIBER_COMMERCIAL_READY: ${MS_REALTY_VIBER_COMMERCIAL_READY:-}
      MS_REALTY_VIEWING_DURABLE_STORE_ENABLED: "true"
      MS_REALTY_WORKSPACE_ID: ${MS_REALTY_WORKSPACE_ID:-workspace-sandanski}
      MS_REALTY_PUBLIC_ORIGIN: https://ms-realty.ms-realty-bg.workers.dev
      MS_REALTY_MCP_ALLOWED_ORIGINS: https://ms-realty.ms-realty-bg.workers.dev

  ollama:
    image: ollama/ollama@sha256:9d30908e41144b1f1da89b9d8e33c07e4aeb43ff41a8660241b1686e2cc330ad
    profiles: ["hermes"]
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 2m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 2200m
    cpus: "1.5"
    networks:
      - hermes
      - hermes-egress

  ollama-model:
    image: ollama/ollama@sha256:9d30908e41144b1f1da89b9d8e33c07e4aeb43ff41a8660241b1686e2cc330ad
    profiles: ["hermes"]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    command: ["pull", "qwen3.5:0.8b"]
    depends_on:
      ollama:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 256m
    networks:
      - hermes

  hermes-agent:
    environment:
      HERMES_AGENT_API_SERVER_KEY: ${HERMES_AGENT_API_SERVER_KEY:?HERMES_AGENT_API_SERVER_KEY is required}
      HERMES_AGENT_MODEL: qwen3.5:0.8b
      HERMES_AGENT_LLM_BASE_URL: http://ollama:11434/v1
      HERMES_AGENT_LLM_API_KEY: ollama-local
    depends_on:
      hermes-agent-bootstrap:
        condition: service_completed_successfully
      ollama-model:
        condition: service_completed_successfully

  edge:
    environment:
      MS_REALTY_ORIGIN_TOKEN: ${MS_REALTY_ORIGIN_TOKEN:?MS_REALTY_ORIGIN_TOKEN is required}
      MS_REALTY_REVIEW_HOST: ${MS_REALTY_REVIEW_HOST}
      MS_REALTY_REVIEW_USER: ${MS_REALTY_REVIEW_USER:?MS_REALTY_REVIEW_USER is required}
      MS_REALTY_REVIEW_PASSWORD_HASH: ${MS_REALTY_REVIEW_PASSWORD_HASH:?MS_REALTY_REVIEW_PASSWORD_HASH is required}
      MS_REALTY_SEARCH_ORIGIN_TOKEN: ${MS_REALTY_SEARCH_ORIGIN_TOKEN:?MS_REALTY_SEARCH_ORIGIN_TOKEN is required}
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:?TYPESENSE_API_KEY is required}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.production-review:/etc/caddy/Caddyfile:ro
      - /opt/ms-realty/shared/media:/srv/media:ro

volumes:
  payload-postgres-data:
    name: ms-realty-production-review-postgres
  typesense-data:
    name: ms-realty-production-review-typesense
  meilisearch-data:
    name: ms-realty-production-review-meilisearch
  local-dev-app-data:
    name: ms-realty-production-review-runtime-data
  runtime-evidence:
    name: ms-realty-production-review-runtime-evidence
  hermes-agent-data:
    name: ms-realty-production-review-hermes
  ollama-data:
    name: ms-realty-production-review-ollama
  caddy-data:
    name: ms-realty-production-review-caddy-data
  caddy-config:
    name: ms-realty-production-review-caddy-config
